[meta]
title = "Next.js Text Intelligence"
description = "Get started using Deepgram's Text Intelligence with this Next.js demo app"
author = "Deepgram DX Team <devrel@deepgram.com> (https://developers.deepgram.com)"
repository = "https://github.com/deepgram-starters/nextjs-text-intelligence"
useCase = "text-intelligence"
language = "javascript"
framework = "nextjs"
sdk = "@deepgram/sdk"
tags = ["text-intelligence", "text-analysis", "nlp", "javascript", "nextjs"]

[check]
command = ["command -v git", "command -v node", "command -v pnpm"]
message = "Prerequisites checked"

[install]
command = "corepack pnpm install"
message = "Dependencies installed"

[install.config]
sample = "sample.env"
output = ".env"

[start]
command = "corepack pnpm dev"
message = "Application running on http://localhost:3000"

[update]
command = "corepack pnpm update"
message = "Dependencies updated"

[clean]
command = ["rm -rf node_modules", "rm -rf .next"]
message = "Build artifacts cleaned"

[eject-frontend]
command = "git submodule update --init --recursive"
message = "Frontend reference and contracts initialized"

[test]
command = "corepack pnpm test"
message = "Production build completed"
